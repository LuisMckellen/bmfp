[project]
name = "bmfp"
version = "0.1.0"
description = "Deterministic discrete-event simulator of one BMFP cell (the journal's Part IX program)"
requires-python = ">=3.10"
dependencies = ["matplotlib", "typer"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
bmfp = "bmfp.cli:app"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bmfp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"bmfp/cli.py" = ["B008"]
