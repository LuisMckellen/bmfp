[project]
name = "meshguard"
version = "0.1.0"
description = "Weakly supervised anomaly detection for unlabeled IoT sensor streams"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scipy", "scikit-learn", "matplotlib", "typer"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
meshguard = "meshguard.cli:app"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["meshguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"meshguard/cli.py" = ["B008"]
